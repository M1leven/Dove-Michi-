<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dov'è Michi?</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      text-align: center;
      max-width: 500px;
      width: 85%;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .location {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    .status {
      font-size: 18px;
      color: #555;
    }

    .updated {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>📍 Dov'è Michi?</h1>

    <div class="location">
      Lubiana 🇸🇮
    </div>

    <div class="status">
      Attualmente in giro per la Slovenia.
    </div>

    <div class="updated">
      Ultimo aggiornamento: 30 settembre 2026
    </div>

  </div>

</body>
</html>
