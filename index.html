<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dov'è Michi?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #203a5f 0%, #101722 45%, #080b10 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 52px;
      line-height: 1;
      text-align: center;
    }

    .location {
      margin-top: 28px;
      font-size: 38px;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 18px;
      color: rgba(255,255,255,0.72);
      text-align: center;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 32px;
    }

    .info-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.55);
      margin-bottom: 8px;
    }

    .value {
      font-size: 20px;
      font-weight: 700;
    }

    .primary .label {
      font-size: 15px;
    }

    .primary .value {
      font-size: 30px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .location {
        font-size: 32px;
      }

      .card {
        padding: 26px;
      }

      .primary .value {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="eyebrow">Michi Location Services</div>

      <h1>📍 Dov'è Michi?</h1>

      <div class="location">
        Ljubljana 🇸🇮
      </div>

      <div class="subtitle">
        Attualmente in Slovenia.
      </div>

      <div class="info-list">

        <div class="info-box primary">
          <div class="label">Qui fino a</div>
          <div class="value">Sabato 3 Ottobre</div>
        </div>

        <div class="info-box">
          <div class="label">Prossima tappa</div>
          <div class="value">Lago di Bled 🏔️</div>
        </div>

        <div class="info-box">
          <div class="label">Da</div>
          <div class="value">3–4 Ottobre</div>
        </div>

      </div>

    </div>

    <div class="footer">
      Ultimo aggiornamento: 30 settembre 2026
    </div>
  </div>

</body>
</html>
